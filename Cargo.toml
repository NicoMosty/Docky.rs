[package]
name = "dockyrs"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/dockyrs-canvas"]
# ----- sin esto `cargo test --release` en la raiz testea SOLO el paquete raiz y
# los tests del crate no corren: los guards de dockyrs-canvas
# (thumbnail_tests) quedarian invisibles para el comando que documenta
# AGENTS.md. Con default-members, `cargo test` y `cargo build` cubren los dos. -----
default-members = [".", "crates/dockyrs-canvas"]

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
dockyrs-canvas = { path = "crates/dockyrs-canvas" }
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
inotify = { version = "0.11", default-features = false }
libc = "0.2"
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smithay-client-toolkit = "0.19"
tiny-skia = "0.12.0"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
zbus = "5.19.0"

# ----- sin optimizar, tiny-skia/resvg/usvg son ~20-50x mas lentos: un render
# de menu pasaba de ~5ms a 150-1500ms y el hover se arrastraba. Aca las
# dependencias se compilan optimizadas y el codigo propio a opt-level 1
# (rebuilds rapidos y todavia depurable).
# OJO: el `*` de abajo NO alcanza a los miembros del workspace, asi que
# `dockyrs-canvas` se compila en 1, igual que cuando vivia dentro de este
# crate. Si algun dia el raster en dev molesta, la palanca es un
# `[profile.dev.package.dockyrs-canvas] opt-level = 3` explicito.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# ----- el binario salia de 14.2 MB con la tabla de simbolos adentro y
# `strip` solo baja 2.75 MB (medido: 14194920 -> 11311696 bytes). -----
# OJO: NO poner `panic = "abort"`. Es el truco obvio para bajar binario y
# rompe `catch_unwind`, que es la red de seguridad del reexec (A5/A6):
# sin unwinding el dock muere de una en vez de relanzarse.
[profile.release]
strip = true
